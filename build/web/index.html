<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B4F6C">
  <title>Guess My Number</title>

  <!-- Favicon (browser tab icon) - multi-size ICO -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

  <!-- Apple touch icon (iOS home screen) -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <!-- PWA manifest (Android home screen + install prompt) -->
  <link rel="manifest" href="/manifest.json">

  <style>
    #loading-container {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #FBFBFF; z-index: 1000;
      transition: opacity 0.4s ease;
    }
    #loading-container.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #DCE0E6;
      border-top-color: #0B4F6C;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-container"><div class="spinner"></div></div>
  <div id="flutter-app"></div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var lc = document.getElementById('loading-container');
      if (lc) lc.classList.add('hidden');
    });
  </script>

  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function (ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: { serviceWorkerVersion: null },
        onEntrypointLoaded: async function (engineInitializer) {
          let appRunner = await engineInitializer.initializeEngine({
            renderer: 'html',
            hostElement: document.getElementById('flutter-app'),
          });
          await appRunner.runApp();
        }
      });
    });
  </script>
</body>
</html>
