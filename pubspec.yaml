name: guessmynumber
description: A real-time number guessing game. Hide a number, chase a secret, or challenge today's puzzle solo.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase — pinned to compatible versions for Flutter 3.47.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # UI: confetti animation for win celebrations (Batch A).
  confetti: ^0.8.0

  # Cupertino icons for iOS-style widgets (Flutter default).
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # NOTE: No google_fonts dependency. We use system fonts so the app
  # works on networks where fonts.gstatic.com is blocked.
